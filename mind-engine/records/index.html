<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111113">
<title>Mind Engine – Records partagés</title>
<meta name="description" content="Les records d'un joueur de Mind Engine, à comparer aux tiens.">
<meta name="robots" content="noindex">
<link rel="icon" href="../logo.svg" type="image/svg+xml">
<style>
  @font-face { font-family: Figtree; font-weight: 400; font-display: swap; src: url(../../fonts/Figtree-400.ttf); }
  @font-face { font-family: Figtree; font-weight: 600; font-display: swap; src: url(../../fonts/Figtree-600.ttf); }
  @font-face { font-family: Figtree; font-weight: 700; font-display: swap; src: url(../../fonts/Figtree-700.ttf); }
  @font-face { font-family: Bricolage; font-weight: 800; font-display: swap;
               src: url(../../fonts/BricolageGrotesque-800.ttf); }

  :root {
    --bg: #111113; --fg: #f4f2fb; --muted: #a09cb0; --faint: #6f6b7d; --line: rgba(255, 255, 255, 0.10);
    --card: rgba(255, 255, 255, 0.045); --field: rgba(255, 255, 255, 0.06);
    --violet: #a78bfa; --teal: #2dd4bf; --yellow: #facc15;
    --gradient: linear-gradient(120deg, var(--violet), var(--teal));
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); overflow-x: clip; }
  body {
    margin: 0; color: var(--fg); overflow-x: clip;
    font: 16px/1.55 Figtree, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(900px 600px at 30% -10%, rgba(124, 92, 240, 0.35), transparent 70%),
      radial-gradient(700px 500px at 110% 40%, rgba(45, 212, 191, 0.12), transparent 70%),
      var(--bg);
    background-repeat: no-repeat;
  }
  main { max-width: 560px; margin: 0 auto; padding: 40px 16px 200px; }
  a { color: inherit; }
  .hidden { display: none !important; }

  .lang { display: flex; justify-content: space-between; align-items: center; gap: 4px; margin: -16px 0 16px; }
  .brand { display: flex; align-items: center; gap: 10px; font: 800 1.15rem Bricolage, Figtree, sans-serif;
           text-decoration: none; }
  .brand img { width: 32px; height: 32px; border-radius: 9px; }
  .lang div { display: flex; gap: 4px; }
  .lang button { font: 700 0.8rem Figtree, sans-serif; letter-spacing: 0.04em; color: var(--muted);
                 background: transparent; border: 1px solid transparent; border-radius: 999px; padding: 6px 12px;
                 cursor: pointer; }
  .lang button[aria-pressed=true] { color: var(--fg); background: var(--field); border-color: var(--line); }

  .overline { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; color: var(--muted);
              text-transform: uppercase; margin: 0; }
  h1 { font: 800 clamp(2.2rem, 10vw, 3rem)/1.05 Bricolage, Figtree, sans-serif; letter-spacing: -0.02em;
       margin: 4px 0 18px; background: var(--gradient); -webkit-background-clip: text; background-clip: text;
       color: transparent; overflow-wrap: anywhere; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; }
  .stat b { display: block; font: 800 1.6rem/1.1 Bricolage, Figtree, sans-serif; }
  .stat span { font-size: 0.8rem; font-weight: 700; color: var(--muted); }

  .tabs { display: flex; gap: 4px; padding: 4px; border-radius: 16px; background: var(--field);
          margin: 20px 0 8px; }
  .tabs button { flex: 1; min-width: 0; height: 36px; border: 0; border-radius: 12px; background: transparent;
                 color: var(--muted); font: 700 0.85rem Figtree, sans-serif; cursor: pointer; }
  .tabs button[aria-pressed=true] { background: rgba(255, 255, 255, 0.12); color: var(--fg); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 14px;
          margin-top: 12px; }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .dot { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center;
         font: 800 0.95rem Bricolage, Figtree, sans-serif; }
  .card-head h2 { font: 800 1.05rem/1.2 Bricolage, Figtree, sans-serif; margin: 0; }
  .card-head small { display: block; color: var(--muted); font-size: 0.8rem; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px 2px; align-items: center; }
  .grid.labelled { grid-template-columns: 60px repeat(5, minmax(0, 1fr)); }
  .grid .head { font-size: 0.7rem; font-weight: 700; color: var(--muted); text-align: center;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grid .row { font-size: 0.75rem; font-weight: 700; color: var(--muted); }
  .grid .v { font: 800 0.95rem Bricolage, Figtree, sans-serif; text-align: center; padding: 6px 0;
             font-variant-numeric: tabular-nums; }
  .grid .v.none { color: var(--faint); }
  .sub { font-size: 0.75rem; font-weight: 700; color: var(--muted); margin: 10px 0 4px; }
  .empty { color: var(--muted); text-align: center; margin: 32px 0; }

  .invalid { text-align: center; margin-top: 40px; }
  .invalid h1 { font-size: 2rem; }
  .invalid p { color: var(--muted); }

  .panel { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 16px calc(18px + env(safe-area-inset-bottom));
           background: rgba(17, 17, 19, 0.92); border-top: 1px solid var(--line);
           backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .panel > div { max-width: 560px; margin: 0 auto; }
  .button { display: block; width: 100%; padding: 15px; border: none; border-radius: 16px;
            background: var(--gradient); color: #111113; font: 700 1.05rem Figtree, sans-serif; text-align: center;
            text-decoration: none; cursor: pointer; }
  .button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); margin-top: 8px;
                  font-size: 0.95rem; padding: 12px; }
</style>
</head>
<body>
<main>
  <nav class="lang" aria-label="Langue / Language">
    <a class="brand" href="../testers/"><img src="../logo.svg" alt="">Mind Engine</a>
    <div>
      <button type="button" data-lang="fr" lang="fr">FR</button>
      <button type="button" data-lang="en" lang="en">EN</button>
    </div>
  </nav>

  <section id="records" class="hidden">
    <p class="overline" id="date"></p>
    <h1 id="name"></h1>
    <div class="stats">
      <div class="stat"><b id="n-records"></b><span data-t="records"></span></div>
      <div class="stat"><b id="n-games"></b><span data-t="games"></span></div>
      <div class="stat"><b id="n-master"></b><span data-t="master"></span></div>
    </div>
    <div class="tabs" role="group" id="tabs"></div>
    <div id="cards"></div>
  </section>

  <section id="invalid" class="invalid hidden">
    <h1 data-t="invalidTitle"></h1>
    <p data-t="invalidBody"></p>
  </section>
</main>

<div class="panel hidden" id="panel">
  <div>
    <a class="button" id="compare" data-t="compare"></a>
    <a class="button ghost" id="store" href="https://play.google.com/store/apps/details?id=com.evansmaignan.mindengine"
       data-t="store"></a>
  </div>
</div>

<script>
  // The records ride in the fragment: the app writes them (records_snapshot.dart in Mind Engine),
  // this page only reads them. Android opens these links in the app when it is installed.
  const levels = ['easy', 'medium', 'hard', 'expert', 'master'];

  // Every game, in the app's order, with its colors (the app's dark theme).
  const games = [
    ['minesweeper', 'Démineur', 'Minesweeper', '#FF7A63', '#3A2220'],
    ['eclipse', 'Éclipse', 'Eclipse', '#F2B13C', '#372C17'],
    ['snapshot', 'Instantané', 'Snapshot', '#4DD8EF', '#123238'],
    ['balance_puzzle', 'Balances', 'Balance Puzzle', '#3FC9B7', '#173331'],
    ['star_battle', "Bataille d'étoiles", 'Star Battle', '#A68CFF', '#29233F'],
    ['game_2048', '2048', '2048', '#FF6FA6', '#3B1F2B'],
    ['numberlink', 'Numberlink', 'Numberlink', '#6AA5FF', '#1C2A40'],
    ['picross', 'Picross', 'Picross', '#6BCB78', '#1C3321'],
    ['rewind', 'Rembobine', 'Rewind', '#8C9EFF', '#262A45'],
    ['intrus', 'Intrus', 'What Changed?', '#FF8599', '#3D2027'],
    ['constellation', 'Constellation', 'Constellation', '#6FB7E0', '#172C38'],
    ['mental_math', 'Calcul mental', 'Mental Math', '#C3D65C', '#2E331A'],
    ['block_smash', 'Casse-compte', 'Block Smash', '#D9A066', '#3A2E1E'],
    ['cube_counter', 'Cubomètre', 'Cube Counter', '#9BB0C2', '#232C34'],
    ['sudoku', 'Sudoku', 'Sudoku', '#A09C95', '#2A2926'],
    ['shikaku', 'Shikaku', 'Shikaku', '#D58CEB', '#3A2340'],
    ['serpentin', 'Serpentin', 'Serpentin', '#8FD67C', '#1F3A1A'],
    ['sculpteur', 'Sculpteur', 'Sculptor', '#D9A970', '#3A2C1C'],
    ['labycalcul', 'Labycalcul', 'Mazecalc', '#F08A3C', '#3D2412'],
    ['cross_sums', 'Sommes croisées', 'Cross Sums', '#D993C9', '#3A2236'],
  ];
  const counts = [5, 10, 15, 20];
  const durations = [30, 60, 90];

  const fr = {
    title: 'Mind Engine – Records partagés',
    recordsOf: 'Les records de', records: 'records', games: 'jeux', master: 'en Master',
    tabs: ['Classique', 'Chrono', 'Marathon', 'Speedrun'],
    levels: ['Facile', 'Moyen', 'Difficile', 'Expert', 'Master'],
    marathon: ['Marathon aléatoire', 'Marathon au choix'], speedrun: ['Speedrun aléatoire', 'Speedrun au choix'],
    gameCount: (n) => n + ' jeux', perGame: (s) => s + ' s par jeu', totalTime: 'Temps total',
    target: "Temps pour l'objectif", nothing: 'Aucun record dans ce mode.',
    compare: 'Me comparer sur Mind Engine Web', store: 'Sur Android ? Télécharger sur Google Play',
    invalidTitle: 'Lien incomplet',
    invalidBody: "Ce lien de records est abîmé ou incomplet. Demande à ton ami de te le renvoyer.",
  };
  const en = {
    title: 'Mind Engine – Shared records',
    recordsOf: 'The records of', records: 'records', games: 'games', master: 'at Master',
    tabs: ['Classic', 'Blitz', 'Marathon', 'Speedrun'],
    levels: ['Easy', 'Medium', 'Hard', 'Expert', 'Master'],
    marathon: ['Random Marathon', 'Chosen Marathon'], speedrun: ['Random Speedrun', 'Chosen Speedrun'],
    gameCount: (n) => n + ' games', perGame: (s) => s + ' s per game', totalTime: 'Total time',
    target: 'Time to target', nothing: 'No records in this mode.',
    compare: 'Compare with me on Mind Engine Web', store: 'On Android? Get it on Google Play',
    invalidTitle: 'Broken link',
    invalidBody: 'This records link is damaged or incomplete. Ask your friend to send it again.',
  };

  // Reads a code as the app writes it: 1~id~name~day~record.v.v.v.v.v~…
  const parse = (code) => {
    const parts = code.split('~');
    if (parts.length < 4 || parts[0] !== '1' || !/^[0-9a-z]{4,16}$/.test(parts[1])) return null;
    let name, day;
    try {
      const b64 = parts[2].replace(/-/g, '+').replace(/_/g, '/');
      const bytes = Uint8Array.from(atob(b64 + '='.repeat((4 - b64.length % 4) % 4)), (c) => c.charCodeAt(0));
      name = new TextDecoder('utf-8', { fatal: true }).decode(bytes).trim();
      day = parseInt(parts[3], 36);
    } catch { return null; }
    if (!name || [...name].length > 24 || !Number.isFinite(day)) return null;
    const records = {};
    for (const entry of parts.slice(4)) {
      const fields = entry.split('.');
      if (!/^[a-z0-9_]{1,40}$/.test(fields[0]) || fields.length > 6) return null;
      const values = {};
      for (let i = 1; i < fields.length; i++) {
        if (!fields[i]) continue;
        if (!/^[0-9a-z]+$/.test(fields[i])) return null;
        values[levels[i - 1]] = parseInt(fields[i], 36);
      }
      if (Object.keys(values).length) records[fields[0]] = values;
    }
    return { name, day: new Date(day * 86400000), records };
  };

  const time = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };

  const code = decodeURIComponent(location.hash.slice(1));
  const snapshot = code ? parse(code) : null;
  let t = fr, tab = 0, lang = 'fr';

  const grid = (rows) => {
    const g = el('div', 'grid' + (rows.some((r) => r.label) ? ' labelled' : ''));
    if (rows.some((r) => r.label)) g.append(el('div'));
    for (const level of t.levels) g.append(el('div', 'head', level));
    for (const row of rows) {
      if (rows.some((r) => r.label)) g.append(el('div', 'row', row.label));
      for (const level of levels) {
        const v = row.values?.[level];
        g.append(el('div', 'v' + (v == null ? ' none' : ''), v == null ? '—' : row.format(v)));
      }
    }
    return g;
  };

  const card = (badge, color, soft, title, subtitle) => {
    const c = el('div', 'card');
    const head = el('div', 'card-head');
    const dot = el('div', 'dot', badge);
    dot.style.background = soft;
    dot.style.color = color;
    const h = el('div');
    h.append(el('h2', null, title));
    if (subtitle) h.append(el('small', null, subtitle));
    head.append(dot, h);
    c.append(head);
    return c;
  };

  const render = () => {
    const r = snapshot.records;
    document.getElementById('date').textContent = t.recordsOf + ' · ' +
      snapshot.day.toLocaleDateString(lang, { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
    document.getElementById('name').textContent = snapshot.name;

    const tabs = document.getElementById('tabs');
    tabs.replaceChildren(...t.tabs.map((label, i) => {
      const b = el('button', null, label);
      b.type = 'button';
      b.setAttribute('aria-pressed', i === tab);
      b.onclick = () => { tab = i; render(); };
      return b;
    }));

    const cards = [];
    if (tab < 2) {
      for (const [id, nameFr, nameEn, color, soft] of games) {
        const key = tab === 0 ? id : id + '_blitz';
        const lower = tab === 0 && id !== 'game_2048';
        const second = tab === 0 && id === 'game_2048' ? r.game_2048_time : null;
        if (!r[key] && !second) continue;
        const name = lang === 'en' ? nameEn : nameFr;
        const c = card(name[0], color, soft, name);
        c.append(grid([{ values: r[key], format: lower ? time : String }]));
        if (second) {
          c.append(el('div', 'sub', t.target), grid([{ values: second, format: time }]));
        }
        cards.push(c);
      }
    } else {
      const marathon = tab === 2;
      [true, false].forEach((random, k) => {
        const kind = random ? 'random' : 'chosen';
        const [color, soft] = random ? ['#6AA5FF', '#1C2A40'] : ['#FF7A63', '#3A2220'];
        const title = (marathon ? t.marathon : t.speedrun)[k];
        for (const seconds of marathon ? durations : [0]) {
          const rows = counts.map((n) => ({
            label: t.gameCount(n),
            values: r[marathon ? `marathon_${kind}_${n}g_${seconds}s` : `speedrun_${kind}_${n}g`],
            format: marathon ? String : time,
          }));
          if (!rows.some((row) => row.values)) continue;
          const c = card(random ? '?' : '≡', color, soft, title, marathon ? t.perGame(seconds) : t.totalTime);
          c.append(grid(rows));
          cards.push(c);
        }
      });
    }
    document.getElementById('cards').replaceChildren(...(cards.length ? cards : [el('p', 'empty', t.nothing)]));
  };

  const setLanguage = (value) => {
    lang = value;
    t = value === 'en' ? en : fr;
    document.documentElement.lang = value;
    document.title = t.title;
    for (const e of document.querySelectorAll('[data-t]')) e.textContent = t[e.dataset.t];
    for (const b of document.querySelectorAll('[data-lang]')) b.setAttribute('aria-pressed', b.dataset.lang === value);
    if (snapshot) render();
  };
  for (const b of document.querySelectorAll('[data-lang]')) {
    b.addEventListener('click', () => {
      setLanguage(b.dataset.lang);
      try { localStorage.setItem('lang', b.dataset.lang); } catch {}
    });
  }

  if (snapshot) {
    let n = 0, master = 0;
    const played = new Set();
    for (const [id, values] of Object.entries(snapshot.records)) {
      if (id === 'game_2048_time') continue;
      n += Object.keys(values).length;
      if (values.master != null) master++;
      const game = games.find(([g]) => id === g || id === g + '_blitz');
      if (game) played.add(game[0]);
    }
    document.getElementById('n-records').textContent = n;
    document.getElementById('n-games').textContent = played.size;
    document.getElementById('n-master').textContent = master;
    document.getElementById('records').classList.remove('hidden');
    document.getElementById('panel').classList.remove('hidden');
    // The web version compares them with the records kept in this browser.
    document.getElementById('compare').href = '../play/?records=' + encodeURIComponent(code);
    // An iPhone has no Play Store: the web version is its way in.
    if (/iPhone|iPad|iPod/.test(navigator.userAgent)) document.getElementById('store').classList.add('hidden');
  } else {
    document.getElementById('invalid').classList.remove('hidden');
  }

  let saved = null;
  try { saved = localStorage.getItem('lang'); } catch {}
  setLanguage(saved || (navigator.language.startsWith('fr') ? 'fr' : 'en'));
</script>
</body>
</html>
