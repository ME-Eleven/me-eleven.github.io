<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable / Page not found</title>
<script>
  // Without Mind Engine installed, a challenge link opens here in the
  // browser: send it on to the testers form, keeping the challenge code.
  const challenge = location.pathname.match(/^\/mind-engine\/challenge\/([^/]+)\/?$/);
  if (challenge) {
    location.replace('/mind-engine/testers/?challenge=' + encodeURIComponent(challenge[1]));
  }
</script>
<style>
  :root { --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121214; --fg: #f2f2f7; --muted: #a1a1a6; } }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 32px 16px; }
  p { color: var(--muted); }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Page introuvable</h1>
  <p>Page not found. <a href="/mind-engine/testers/">Mind Engine</a></p>
</main>
</body>
</html>
